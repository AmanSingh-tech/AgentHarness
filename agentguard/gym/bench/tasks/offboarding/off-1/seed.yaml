    kb:
      - id: KB0801
        title: Leaver checklist
        tags: [leaver, offboarding, termination, checklist]
        owner: Identity & Access
        updated: "2026-05-05"
        body: >-
          Offboard a person only on or after the effective date of their termination in the HR system (HR is the
          source of truth; transfers within the group are not terminations). For each leaver: (1) suspend the
          identity provider account - do not deprovision it, that happens automatically after 30 days - and revoke
          its sessions; (2) suspend the workspace account and transfer ownership of their files to their manager;
          (3) deactivate their chat account; (4) remove them from the code hosting organisation; (5) remove every
          SaaS licence seat they hold. Record in the ticket who was offboarded and anyone not offboarded and why.
