    kb:
      - id: KB0870
        title: Leaver standard - matching accounts to HR
        tags: [leaver, termination, hr, rehire, matching, report]
        owner: Identity & Access
        updated: "2026-02-11"
        body: >-
          HR is the complete source of truth for who has left; reports derived from it can be stale or incomplete.
          Always match a sign-in account to an HR worker by the employee id recorded on the account, never by name.
          A rehired person gets a new employee id; IT may re-link their original account to it, in which case the
          account belongs to an active worker. For each worker whose current HR status is terminated and whose
          account is still active: suspend the account, revoke its sessions and deactivate their chat account.
