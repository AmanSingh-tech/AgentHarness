    kb:
      - id: KB0910
        title: Mover policy - changing department
        tags: [mover, transfer, department, joiner, leaver, baseline]
        owner: Identity & Access
        updated: "2026-01-20"
        body: >-
          When an employee changes department, do not suspend or offboard them. Remove access that belongs to the old
          department - its groups (owned by that department), licences for its applications, and its confidential
          or restricted document sites - unless HR has recorded a handover arrangement, which takes precedence until
          its end date. Keep company-wide access (All Staff, Office Suite). Add the new department's baseline groups:
          Engineering - Engineering, Source Code Read. Sales - Sales, CRM Read. Finance - Finance, ERP Read-only.
          Anything beyond the baseline needs a separate access request.
