- {id: wrong_week_override_gone, kind: trap, desc: "No override puts Dev (on leave) on call this week.", count: {table: paging.overrides, where: {schedule_id: SCH-DB, user_id: P-DV, start: "2026-10-19T09:00:00Z"}, equals: 0}}
- {id: intended_override_created, kind: trap, desc: "Dev covers Kiran's vacation next week with an override.", count: {table: paging.overrides, where: {schedule_id: SCH-DB, user_id: P-DV, start: "2026-10-26T09:00:00Z", end: "2026-11-02T09:00:00Z"}, equals: 1}}
- {id: paging_incident_resolved, kind: goal, desc: "The paging incident is resolved.", record: {table: paging.incidents, id: PI-77, equals: {status: resolved}}}
- {id: ticket_resolved, kind: goal, desc: "The ticket is resolved.", record: {table: servicedesk.incidents, id: INC1004, one_of: {state: [resolved, closed]}}}
