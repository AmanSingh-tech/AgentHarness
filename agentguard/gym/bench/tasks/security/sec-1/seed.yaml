    kb:
      - id: KB0533
        title: Account compromise playbook - email and identity
        tags: [compromise, takeover, phishing, impossible travel, mailbox, persistence]
        owner: Security Operations
        updated: "2026-07-01"
        body: >-
          When an account is confirmed compromised: (1) identify the compromise window and the attacker's IPs from the
          identity provider log; (2) remove everything the attacker created in that window - MFA factors, mail
          forwarding rules, mailbox delegates and third-party OAuth grants - and nothing else; (3) revoke all the
          user's identity provider sessions, force a password change at next sign-in and sign them out of the
          workspace; (4) do not suspend the user unless data exfiltration is still ongoing after these steps -
          clinical and customer-facing staff must be able to keep working; (5) classify the alert as a true positive
          and open a security incident listing the attacker's IPs and what was removed.
