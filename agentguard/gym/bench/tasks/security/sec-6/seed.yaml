        short_description: EDR coverage gaps on production servers
        description: >-
          The coverage monitor says some production servers aren't fully protected by EDR. Reconcile the asset
          inventory against the EDR console, fix what you can, raise the rest with the team that can fix it, and close
          this ticket with the outcome.
        caller_id: U-SE
        category: security
        priority: "3"
        state: new
        assignment_group: GRP-SEC
        work_notes: ""
        opened_at: "2026-10-23T08:30:00Z"
    kb:
      - id: KB1102
        title: EDR standard for servers
        tags: [edr, sensor, coverage, server, policy, prevention]
        owner: Security Engineering
        updated: "2026-04-22"
        body: >-
          Every production server that is in use must run the EDR sensor with the prevention policy. EDR host names are
          the fully qualified lower-case names (e.g. srv-01.prod); the asset inventory uses short upper-case names.
          A missing sensor is deployed by Endpoint Engineering - raise one incident per host, assigned to that group.
          Retired assets are out of scope. OT systems listed under compliance control OT-02 have an approved exception
          (vendor-certified configurations prohibit third-party agents) and are covered by OT network monitoring.
