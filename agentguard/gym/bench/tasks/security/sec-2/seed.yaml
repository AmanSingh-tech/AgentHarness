    kb:
      - id: KB0640
        title: Credential leak response
        tags: [secret, leak, key, rotation, revoke, scanning, sandbox]
        owner: Security Operations
        updated: "2026-03-14"
        body: >-
          When a production credential is exposed: rotate it (create a new version) and revoke every older version
          that is still active - not just the exposed one - so that only the new version works. Check the vault access
          log for any use of the exposed version since the exposure; any use from an IP outside our ranges (10.0.0.0/8)
          must be reported as a security incident naming the IPs. Classify the alert as a true positive. Sandbox and
          test keys are publishable by design (they only reach the sandbox environment): close such alerts as benign
          positives and do not rotate them.
