        updated: "2026-02-28"
        body: "For every custodian on an active legal hold: (1) their workspace account must be in the /Legal Hold organisational unit, which disables automated deletion policies; (2) their mailbox is retained only while an Office Suite licence seat stays assigned to them - when a seat is removed, the mailbox and its files are deleted after 20 days, so a custodian who leaves must keep (or be re-assigned) their seat. Preservation does not require the custodian to have access: a leaver's account stays suspended. People who are not custodians are out of scope."
