        body: "Two independent tests apply to every approved vendor. (1) A vendor that processes personal or health data must have an unexpired data processing agreement (DPA), whatever its tier. (2) A critical or high tier vendor must have an unexpired security report. A vendor failing either test is set to under_review and gets a finding naming the vendor: severity high if it processes personal or health data, otherwise medium. Vendors that are blocked stay blocked. Low-tier vendors that process no data need neither document."
