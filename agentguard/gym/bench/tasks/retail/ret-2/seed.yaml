    kb:
      - id: KB2520
        title: Refund fraud rule - item not received
        tags: [fraud, refund, ring, device, not received, new account]
        owner: Fraud Operations
        updated: "2026-08-19"
        body: "Accounts created within the last 7 days that share a device with at least one other account requesting a refund form a refund ring. Refund none of the ring's requests, reject them, restrict every account in the ring, and open one incident assigned to Fraud Operations listing the accounts and the shared device. A new account on its own device is not suspicious by itself - process it normally. Look up each order before refunding; never refund more than the order amount."
