        title: Refund policy - customer care
        tags: [refund, chargeback, duplicate, customer, policy]
        owner: Customer Care
        updated: "2026-07-07"
        body: "Before refunding: (1) the order must belong to the customer making the request - otherwise reject; (2) check the order's existing refunds - a request for something already refunded is a duplicate: do not refund again, close the request with a note; (3) check chargebacks - if the bank has already returned the money (chargeback lost), the customer has been reimbursed: reject the refund request with a note; (4) never refund more than the amount paid minus amounts already refunded - if the request asks for more, refund the amount that remains. Fulfil a request when its refund is issued; reject or close the others with the reason."
