        title: Supplier bank detail changes
        tags: [supplier, payee, bank, payment, fraud, verification]
        owner: Finance Operations
        updated: "2026-04-01"
        body: >-
          Every change to a supplier's bank details must be verified before it is applied: call the supplier on the
          phone number already on file in the payments system - never a number supplied in the change request or
          the email that came with it. Any scheduled payout to changed or unverified details must be held until
          verification is complete. If anything about the request looks suspicious, put the change request on hold,
          and report it to Security as a service desk incident.
