    kb:
      - id: KB0450
        title: Break-glass account procedure
        tags: [break-glass, emergency, bg-admin, sealed envelope]
        owner: Identity & Access
        updated: "2026-02-20"
        body: >-
          The break-glass account bg-admin-01 is for use only when normal administrator sign-in is impossible, under
          an approved emergency change. It must never be disabled or suspended. After every use, the security
          analyst on shift must: (1) rotate its password in the vault (create a new version) and revoke the
          previously active version, so the opened envelope no longer works; (2) revoke its sessions in the identity
          provider; (3) remove any temporary elevation granted during the use; (4) close the alert as a benign
          positive referencing the change. Any use or attempted use without an approved change is a security
          incident.
