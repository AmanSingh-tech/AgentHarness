    kb:
      - id: KB0521
        title: Guest access policy - document sites
        tags: [guest, external, sharing, restricted, vendor, dpa]
        owner: Data Protection Office
        updated: "2026-05-02"
        body: >-
          External guests may access a restricted site only if (a) their organisation is an approved vendor in the
          vendor register with an unexpired data processing agreement (DPA), (b) the permission carries a
          justification and an expiry date that has not passed, and (c) the address is not on a personal email
          domain. Links with scope "anyone" are not permitted on restricted sites. A restricted site with no approved
          guests must have external sharing switched off. Internal sites and public sites are out of scope of this
          review.
