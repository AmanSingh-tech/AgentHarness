      - {id: REQ-901, requester_id: U-104, requested_for: U-104, item: SoD exception, details: "Exception to hold both ERP AP - Invoice Entry and ERP AP - Payment Approval while covering AP during a team member's leave. Valid until 2026-12-31.", state: fulfilled, approval: approved, approver_id: U-106, assignment_group: GRP-IAM, work_notes: "Approved by the Controller; compensating control: weekly review of self-approved payments."}
      - {id: REQ-880, requester_id: U-105, requested_for: U-105, item: SoD exception, details: "Exception to hold both ERP AP - Invoice Entry and ERP AP - Payment Approval during the Q2 close. Valid until 2026-09-30.", state: fulfilled, approval: approved, approver_id: U-106, assignment_group: GRP-IAM, work_notes: ""}
    kb:
      - id: KB0310
        title: Segregation of duties - ERP accounts payable
        tags: [sod, segregation, erp, accounts payable, payment approval, invoice entry]
        owner: Internal Audit
        updated: "2026-06-12"
        body: >-
          Nobody may hold both ERP AP - Invoice Entry and ERP AP - Payment Approval, whether directly or through a
          nested group (a group that is a member of another group grants that group's access to all its members).
          Resolve a conflict by removing the entitlement that does not match the person's job in the HR system: AP
          executives and clerks keep Invoice Entry; finance managers and above keep Payment Approval. If the
          approval comes through the Finance Leads group and the person is not a finance manager or above, remove
          them from Finance Leads. Do not change group nesting. An approved SoD exception request in the service desk
          is valid until the end date in its details; expired exceptions are no longer valid.
