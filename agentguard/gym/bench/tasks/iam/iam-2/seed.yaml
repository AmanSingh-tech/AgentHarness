        short_description: SoD conflicts - invoice entry and payment approval in the ERP
        description: >-
          Our ERP payments review found that some people can both enter supplier invoices and approve payments.
          Please fix the access so that nobody holds both, in line with our segregation-of-duties policy, and close
          the ticket when done.
        caller_id: U-900
