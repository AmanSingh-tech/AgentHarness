      - id: KB0412
        title: Privileged access standard - identity provider administrators
        tags: [privileged, admin, super admin, standing access, break-glass]
        owner: Security Governance
        updated: "2026-03-30"
        body: >-
          Standing membership of IdP Super Admins is limited to the approved roster recorded as evidence on
          compliance control IAM-07. Temporary elevation is allowed only through an approved change, and the
          membership must carry the change's expiry date. The break-glass account must always remain a member and
          must never be disabled. When removing someone from the admin group, remove only the admin membership -
          their normal access is unaffected.
