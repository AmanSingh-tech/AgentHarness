    kb:
      - id: KB0602
        title: Access request standard - group membership
        tags: [access request, approval, manager, delegate, privileged]
        owner: Identity & Access
        updated: "2026-04-14"
        body: >-
          A group-membership request may be fulfilled only when approved by the requested-for person's line manager
          (per the HR system). If the manager is on leave, their delegate recorded in the service desk may approve;
          record the delegate as the approver. Nobody may approve their own request - treat a self-approval as no
          approval: set approval back to pending and put the request on hold. Privileged groups additionally
          require approval from the Security group; until then put the request on hold. Reject requests for people
          who are not active employees. If the person already has the access, close the request as fulfilled.
