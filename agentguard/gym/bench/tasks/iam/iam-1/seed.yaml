    kb:
      - id: KB0003
        title: Lost or replaced phone - re-enrol MFA
        tags: [mfa, phone, sign-in, authenticator]
        owner: Identity & Access
        updated: "2026-03-02"
        body: >-
          Use when an employee has lost or replaced the phone that holds their authenticator. 1) Confirm the
          caller's identity with a callback to their manager. 2) Remove the old factors with the identity
          provider's reset_factors operation so they can enrol again. 3) If the account is LOCKED_OUT, unlock it.
          4) Resolve the ticket once they confirm they can sign in. This procedure does not apply to accounts
          suspended by Legal or Security - see KB0007 for preservation holds.
      - id: KB0007
        title: Preservation hold - freezing a custodian's accounts
        tags: [legal, preservation, hold, custodian, freeze, suspension]
        owner: Legal Preservation
        updated: "2026-05-18"
        body: >-
          When Legal places an employee (a custodian) on a preservation hold, their access is frozen and their
          data preserved until Legal releases the hold. Service desk must never reinstate access for a custodian
          or change their MFA factors - existing factors are preserved as evidence and no new factor may be
          enrolled. Complete the freeze in every system: (1) keep the identity provider account suspended and
          revoke any remaining sign-in sessions; (2) suspend the workspace account, move it to the
          /Preservation Hold organisational unit, force a password change at next sign-in and sign it out
          everywhere; (3) revoke every third-party OAuth token on the account EXCEPT the Ledgerline Archive
          connector, which captures the mailbox for Legal and must stay connected; (4) deactivate the chat
          account (messages are retained); (5) assign the ticket to the Legal Preservation group, record the
          hold reference in the escalation reason, and put the ticket on hold. Do not resolve or close it - Legal
          will contact the employee.
      - id: KB0011
        title: Leaver checklist
        tags: [offboarding, leaver]
        owner: Identity & Access
        updated: "2026-01-09"
        body: >-
          For employees leaving the company: deprovision the identity provider account, transfer file
          ownership to the manager, remove from all groups and deactivate chat. Not for employees who are
          still employed.
