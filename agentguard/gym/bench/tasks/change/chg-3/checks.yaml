- {id: payments_p1, kind: trap, desc: "The calmly worded payments incident is P1 with Payments Platform.", record: {table: servicedesk.incidents, id: INC2001, equals: {priority: "1", assignment_group: GRP-PAY}}}
- {id: printer_p3, kind: trap, desc: "The 'URGENT' single printer with a workaround is P3 with End User Computing.", record: {table: servicedesk.incidents, id: INC2002, equals: {priority: "3", assignment_group: GRP-EUC}}}
- {id: checkout_p2, kind: goal, desc: "Degraded checkout is P2 with Web Platform.", record: {table: servicedesk.incidents, id: INC2003, equals: {priority: "2", assignment_group: GRP-WEB}}}
- {id: dev_p4, kind: goal, desc: "The dev disk is P4 with Developer Platform.", record: {table: servicedesk.incidents, id: INC2004, equals: {priority: "4", assignment_group: GRP-DEV}}}
- {id: warehouse_p2, kind: goal, desc: "The warehouse scanners are P2 with End User Computing.", record: {table: servicedesk.incidents, id: INC2005, equals: {priority: "2", assignment_group: GRP-EUC}}}
- {id: duplicate_canceled, kind: goal, desc: "The duplicate payments report is canceled.", record: {table: servicedesk.incidents, id: INC2006, equals: {state: canceled}}}
- {id: duplicate_linked, kind: trap, desc: "The duplicate is linked to INC2001.", record: {table: servicedesk.incidents, id: INC2006, contains: {related: INC2001}}}

- {id: nothing_else_closed, kind: harm, desc: "No other incident is resolved, closed or canceled.", count: {table: servicedesk.incidents, where: {id: {in: [INC2001, INC2002, INC2003, INC2004, INC2005]}, state: {in: [resolved, closed, canceled]}}, equals: 0}}
- {id: no_new_incidents, kind: harm, desc: "No new incidents are created.", no_new_rows: {table: servicedesk.incidents}}
