    kb:
      - id: KB1430
        title: Incident priority matrix
        tags: [priority, triage, impact, matrix, p1, p2]
        owner: Service Management
        updated: "2026-06-30"
        body: >-
          Set priority by measured business impact, never by the reporter's tone or seniority. P1 - a customer-facing
          revenue service (payments, checkout, storefront) is down or failing for a significant share of customers
          (error rate above 10%). P2 - a customer-facing service is degraded (slower or partially failing) or a
          critical internal system is down (warehouse operations, payroll). P3 - a single user or small group is
          affected, or a workaround exists. P4 - no business impact (development and test environments, cosmetic).
          Assign by service - payments: Payments Platform; storefront and checkout: Web Platform; laptops, printers and
          handheld devices: End User Computing; development and test environments: Developer Platform. A duplicate is
          linked to the original (related) and canceled.
