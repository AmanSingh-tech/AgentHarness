    kb:
      - id: KB1410
        title: Change records - reconciliation with production
        tags: [change, reconciliation, audit, deploy, unauthorized]
        owner: Change Management
        updated: "2026-03-03"
        body: >-
          The deploy history is the source of truth. After a change window: a change whose deploy succeeded is set to
          implemented; a change whose deploy failed or was rolled back is set to failed; a change whose window has
          passed with no deploy is set to canceled. A production deploy with no change record is an unauthorised
          change - raise an incident assigned to Change Management naming the service and version. Never create a
          change record retroactively for an unauthorised deploy.
