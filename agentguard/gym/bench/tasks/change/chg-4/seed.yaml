        title: Release standard - regressions after a deploy
        tags: [release, rollback, regression, status page, deploy]
        owner: Release Engineering
        updated: "2026-05-15"
        body: >-
          If a customer-facing regression starts with a deploy, roll back first and investigate after: deploy the last
          version that was good before it. Set the service's status page to degraded while customers are affected and
          until the synthetic checks confirm recovery. Set the change of the bad release to failed, and record the
          cause (service and version) on the incident; keep the incident open until recovery is verified.
