[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Harness-agnostic trust & reliability layer for AI agents: AgentGym (testing) + AgentShield (runtime enforcement)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.11.7",
  "sqlmodel==0.0.22",
  "pyyaml==6.0.2",
  "typer==0.16.0",
  "click==8.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
]
llm = [
  "anthropic==1.17.0",
  "openai==3.36.1",
]
langgraph = [
  "langchain==1.4.7",
  "langgraph==1.2.16",
  "langchain-core==1.6.13",
  "langchain-anthropic==1.7.6",
  "langchain-openai==1.7.2",
]

[project.scripts]
agentguard = "agentguard.cli.main:app"

# Third-party harnesses register here too; the key is the prefix in `--harness <key>:<variant>`.
[project.entry-points."agentguard.harnesses"]
scripted = "agentguard.harnesses.scripted:ScriptedHarness"
native = "agentguard.harnesses.llm.native:NativeHarness"
langgraph = "agentguard.harnesses.llm.langgraph_harness:LangGraphHarness"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.setuptools.package-data]
"agentguard" = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agentguard"]
omit = ["agentguard/cli/*"]
